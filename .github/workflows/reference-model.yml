name: Reference-model reproducibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  reference-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install reference-model dependency
        run: python -m pip install cryptography
      - name: Run all reference-model regression checks
        run: python reference_model/test_hibaf_v2.py
